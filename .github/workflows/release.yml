# Builds the extension zip and the `lanehead` CLI and attaches both to a GitHub Release.
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand from the Actions tab for an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG doesn't match package.json version $version"; exit 1; }
      - run: pnpm check
      - run: pnpm zip && pnpm build:cli
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$(ls .output/lanehead-*-chrome.zip)"
          notes="Download **$(basename "$zip")**, unzip it, then in Chrome open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped folder. For agents, download **lanehead.js** and run \`node lanehead.js install\`. Full steps: [README](https://github.com/${{ github.repository }}#install)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" dist/lanehead.js --clobber
          else
            gh release create "$TAG" "$zip" dist/lanehead.js --title "Lanehead $TAG" --notes "$notes"
          fi
